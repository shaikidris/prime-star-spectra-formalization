version: "v0.4"

project:
  name: "Uniform finite-prime-sum spectra and dynamics of finite prime-cover graphs"
  description: >-
    A Lean 4 formalization of the ordered adjacency spectrum of finite
    prime-cover graphs. Its root-centred specialization proves that the
    square of the largest ordered eigenvalue equals pi(X) plus four times
    the finite prime sum of 1/(p-1), up to o(1). More generally, for every
    fixed finite set S of deleted primes and epsilon > 0, the same law with
    the explicit centre correction c(a) holds uniformly over allowed centres
    a <= (log X)^(1/2-epsilon). The same window admits a uniform
    centre--shell evolution theorem at the explicit first-exit frequency,
    with a finite localization-plus-phase error bound.
  authors:
    - "Idris Ali Shaik"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Idris Ali Shaik"

classification:
  arxiv: [math.CO, math.NT]
  msc2020: [05C50, 11N05]

sources:
  - title: "Prime-Star Localization and Second-Order Spectra of Finite Divisibility Cover Graphs"
    authors:
      - "Idris Ali Shaik"
    id: "https://doi.org/10.5281/zenodo.22163492"
    type: "paper"
    location: "Theorem 9.6 (equivalent finite-prime-sum form) and Corollary 9.9"
    relationship: "formalizes"
    note: >-
      The selected declarations formalize the uniform theorem in the
      finite-prime-sum form used by the manuscript's headline, its top-mode
      specialization, and the finite explicit-frequency estimate underlying
      Corollary 9.9. The same preprint is also available at SSRN 7364645,
      https://doi.org/10.2139/ssrn.7364645.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "On the eigenstructure of sparse matrices related to the prime number theorem"
    authors:
      - "J. Kline"
    id: "https://doi.org/10.1016/j.laa.2019.09.022"
    type: "paper"
    location: "Linear Algebra and its Applications 584 (2020), 409-430"
    relationship: "background"
    note: "Background on dominant eigenvalues of a different sparse arithmetic matrix."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    The compared declarations are the undeleted root-centred headline, the
    full uniform finite-prime-sum form of manuscript Theorem 9.6, and the
    finite explicit-frequency dynamics bound underlying Corollary 9.9, for
    natural cutoffs X and finite deletion sets S.
    The submitted proof development also contains the finite star
    decomposition, perturbation, localization, first-exit, quantitative PNT,
    and prime-Mertens layers used in the proof. The Comparator selection does
    not advertise the manuscript's remaining corollaries as separate results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "PrimeStar.palomar_uniform_finite_prime_sum"
      file: "PrimeCoverSolution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "prime-cover-comparator.json"
    - declaration: "PrimeStar.palomar_top_finite_prime_sum"
      file: "PrimeCoverSolution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "prime-cover-comparator.json"
    - declaration: "PrimeStar.palomar_uniform_explicit_frequency_dynamics"
      file: "PrimeCoverSolution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "prime-cover-comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (GPT-5 family)"]
      framework: "Codex desktop and Lean 4"
      tool_setup: >-
        AI-assisted theorem decomposition, Lean implementation, compilation,
        axiom auditing, and Palomar packaging; all public declarations were
        checked by Lean's kernel on the pinned project.
      cost:
        wall_time: "multiple sessions over approximately one week"
        spend_usd: "subscription-based and not tracked"
        hardware: "local Apple silicon workstation"
      prompting_notes: >-
        Work proceeded through explicit theorem-status ledgers, finite
        negative controls, proof-cone audits, and repeated full rebuilds.
  spend_usd: "subscription-based and not tracked"
  notes: >-
    The author directed theorem selection and scope. OpenAI Codex performed
    much of the Lean implementation and verification. The author also supplied
    review text generated by several other language-model systems; those reads
    were advisory and are not represented as independent human review.

fidelity:
  divergences: >-
    No mathematical divergence is known for the selected results. The Lean
    eigenvalue statement uses natural cutoffs X, the finite graph's exact
    arithmetic rank, and an epsilon-delta formulation of the manuscript's
    uniform o(1). The dynamics declaration fixes the first-exit correction by
    literal finite prime sums, identifies the evolution as exp(-itA), displays
    the localization and Feshbach constants, normalizes the centre and shell
    states, and proves positivity of both frequencies and their sum. It states
    the finite explicit bound from which the manuscript's time-window
    asymptotic follows. The inherited
    substantive source is
    https://github.com/shaikidris/prime-star-spectra-formalization at commit
    e40d375396f2965757600d7e0351ccdb69423c9b. This submitted snapshot is a
    toolchain compatibility port with a definitionally synchronized Palomar
    Challenge/Solution adapter. The current statement surface adds the root
    specialization and a project-local explicit-frequency dynamics module to
    that inherited proof cone, and selects all three results in one Comparator
    entry.

review:
  status: "self-assessed and machine-checked; independent human expert review pending"
  reviewers:
    - "Idris Ali Shaik"
  notes: >-
    The source-to-Lean quantifiers and constants were audited repeatedly, the
    complete package was rebuilt on the pinned toolchain, and the selected
    public theorem reports only propext, Classical.choice, and Quot.sound.
    Language-model reviews do not count as independent human validation.

alignment:
  namespace: "PrimeStar"
  statements:
    - source: "Manuscript headline (undeleted root-centred form)"
      lean: "PrimeStar.palomar_top_finite_prime_sum"
      module: "PrimeCoverChallenge"
      status: "proved"
      note: >-
        This is the a=1, S=empty specialization. The root has arithmetic rank
        one, so its zero-based ordered spectral index is zero; the centre
        correction vanishes and allowedPrimeCount is Nat.primeCounting.
    - source: "Manuscript headline and Theorem 9.6 (finite-prime-sum form)"
      lean: "PrimeStar.palomar_uniform_finite_prime_sum"
      module: "PrimeCoverChallenge"
      status: "proved"
      note: >-
        The Challenge states the j(a)-th ordered adjacency-eigenvalue law with
        the literal finite sum over 1/(p-1). PrimeCoverSolution connects it to
        PrimeStar.eventually_logarithmicWindow_ranked_finitePrimeSum_proved;
        the exact partial-fraction identity and prime-Mertens limit connect
        this form to the constant-layer theorem.
    - source: "Corollary 9.9 (explicit-frequency centre--shell dynamics)"
      lean: "PrimeStar.palomar_uniform_explicit_frequency_dynamics"
      module: "PrimeCoverChallenge"
      status: "proved"
      note: >-
        The Challenge states the finite uniform norm bound at frequency
        sqrt(pi_S(X/a) + M_{S,a,X}). It exposes M_{S,a,X} as literal up- and
        down-prime sums, the evolution as exp(-itA), and the numerical
        localization and Feshbach constants. The centre and shell states have
        norm one and hub coordinates one and zero, respectively. Both the
        ordered eigenfrequency and the approximate frequency are positive, so
        their sum is a valid denominator. The right-hand side is the sum of
        the logarithmic-window localization bound and the Lipschitz phase error
        obtained from the source-weighted Feshbach remainder. This is the
        quantitative finite statement underlying the manuscript's o(1)
        dynamics on its stated time scale.

acknowledgements: >-
  The formalization uses Lean 4, Mathlib, and the PrimeNumberTheoremAnd
  development of Alex Kontorovich and collaborators. Comparator, NanoDa, and
  the Palomar submission template provide the independent statement-checking
  and packaging conventions.
