# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Uniform finite-prime-sum spectra of finite prime-cover graphs"
  description: >-
    A Lean 4 formalization of the ordered adjacency spectrum of finite
    prime-cover graphs. For every fixed finite set S of deleted primes and
    epsilon > 0, uniformly over allowed centres
    a <= (log X)^(1/2-epsilon), it proves that the square of the eigenvalue
    at the arithmetic rank j(a) equals pi_S(X/a) plus four times the finite
    allowed-prime sum of 1/(p-1), plus c(a) + o(1). This is the manuscript's
    elementary finite-sum form of its uniform constant-layer theorem.
  authors:
    - "Idris Ali Shaik"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Idris Ali Shaik"

classification:
  arxiv: [math.CO, math.NT]
  msc2020: [05C50, 11N05]

sources:
  - title: "Prime-Star Localization and Second-Order Spectra of Finite Divisibility Cover Graphs"
    authors:
      - "Idris Ali Shaik"
    id: "https://doi.org/10.5281/zenodo.22163492"
    type: "paper"
    location: "Theorem 9.6 (equivalent finite-prime-sum form)"
    relationship: "formalizes"
    note: >-
      The selected declaration formalizes the uniform theorem in the
      finite-prime-sum form used by the manuscript's headline. The same
      preprint is also available at SSRN 7364645,
      https://doi.org/10.2139/ssrn.7364645.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "On the eigenstructure of sparse matrices related to the prime number theorem"
    authors:
      - "J. Kline"
    id: "https://doi.org/10.1016/j.laa.2019.09.022"
    type: "paper"
    location: "Linear Algebra and its Applications 584 (2020), 409-430"
    relationship: "background"
    note: "Background on dominant eigenvalues of a different sparse arithmetic matrix."
    license: "unknown"
    author_endorsement: "n/a"

status:
  scope: >-
    The compared declaration is the full uniform finite-prime-sum form of
    manuscript Theorem 9.6, for natural cutoffs X and finite deletion sets S.
    The submitted proof development also contains the finite star
    decomposition, perturbation, localization, first-exit, quantitative PNT,
    and prime-Mertens layers used in the proof. The Comparator selection does
    not advertise the manuscript's other corollaries as separate results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "PrimeStar.palomar_uniform_finite_prime_sum"
      file: "PrimeCoverSolution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "prime-cover-comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (GPT-5 family)"]
      framework: "Codex desktop and Lean 4"
      tool_setup: >-
        AI-assisted theorem decomposition, Lean implementation, compilation,
        axiom auditing, and Palomar packaging; all public declarations were
        checked by Lean's kernel on the pinned project.
      cost:
        wall_time: "multiple sessions over approximately one week"
        spend_usd: "subscription-based and not tracked"
        hardware: "local Apple silicon workstation"
      prompting_notes: >-
        Work proceeded through explicit theorem-status ledgers, finite
        negative controls, proof-cone audits, and repeated full rebuilds.
  spend_usd: "subscription-based and not tracked"
  notes: >-
    The author directed theorem selection and scope. OpenAI Codex performed
    much of the Lean implementation and verification. The author also supplied
    review text generated by several other language-model systems; those reads
    were advisory and are not represented as independent human review.

fidelity:
  divergences: >-
    No mathematical divergence is known for the selected result. The Lean
    statement uses natural cutoffs X, the finite graph's exact arithmetic rank,
    and an epsilon-delta formulation of the manuscript's uniform o(1). The
    authoritative substantive source is
    https://github.com/shaikidris/prime-star-spectra-formalization at commit
    e40d375396f2965757600d7e0351ccdb69423c9b. This submitted snapshot is a
    toolchain-only compatibility port: theorem statements, proofs, Challenge,
    Solution, and Comparator selection are unchanged.

review:
  status: "self-assessed and machine-checked; independent human expert review pending"
  reviewers:
    - "Idris Ali Shaik"
  notes: >-
    The source-to-Lean quantifiers and constants were audited repeatedly, the
    complete package was rebuilt on the pinned toolchain, and the selected
    public theorem reports only propext, Classical.choice, and Quot.sound.
    Language-model reviews do not count as independent human validation.

alignment:
  namespace: "PrimeStar"
  statements:
    - source: "Manuscript headline and Theorem 9.6 (finite-prime-sum form)"
      lean: "PrimeStar.palomar_uniform_finite_prime_sum"
      module: "PrimeCoverChallenge"
      status: "proved"
      note: >-
        The Challenge states the j(a)-th ordered adjacency-eigenvalue law with
        the literal finite sum over 1/(p-1). PrimeCoverSolution connects it to
        PrimeStar.eventually_logarithmicWindow_ranked_finitePrimeSum_proved;
        the exact partial-fraction identity and prime-Mertens limit connect
        this form to the constant-layer theorem.

acknowledgements: >-
  The formalization uses Lean 4, Mathlib, and the PrimeNumberTheoremAnd
  development of Alex Kontorovich and collaborators. Comparator, NanoDa, and
  the Palomar submission template provide the independent statement-checking
  and packaging conventions.
